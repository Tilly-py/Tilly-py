// ============================================
// autoexec.cfg (CS 1.6 console vibe profile)
// ============================================

developer "1"
con_notifytime "4"

// Identity
name "Alex"
cl_logofile "lambda"
cl_logocolor "#Valve_Orange"
topcolor "0"
bottomcolor "0"

// Theme (vibe)
con_color "255 180 30"
brightness "1"
gamma "2.5"

// Focus toggles (imaginary cvars for README vibe)
mau "1"
programming "1"
ux_ui "1"
python "1"
javascript "1"
html_css "1"
postgresql "1"

// Netgraph flavor
net_graph "1"
net_graphpos "2"
net_graphwidth "192"
graphheight "64"

echo "----------------------------------------"
echo "autoexec.cfg loaded"
echo "MAU CONNECTED"
echo "----------------------------------------"
